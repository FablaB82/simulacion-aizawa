<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aizawa + SVG (Atracción / Repulsión)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root { --bg:#07090d; --panel:#10151de8; --text:#f2f5f8; --muted:#9ba6b2; --accent:#66e3ff; }
    html,body { margin:0; padding:0; overflow:hidden; background:var(--bg); color:var(--text); font-family:Inter,system-ui,Arial,sans-serif; }
    #ui {
      position: absolute; left: 12px; top: 12px; z-index: 20;
      width: min(360px, calc(100vw - 24px)); background: var(--panel);
      border: 1px solid #1f2a35; border-radius: 16px; padding: 12px;
      backdrop-filter: blur(8px);
    }
    .row { margin: 10px 0; }
    label { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
    input[type="range"], input[type="file"] { width:100%; }
    .sub { color:var(--muted); font-size:12px; line-height:1.35; margin-bottom:6px; }
    .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
    button {
      border:none; border-radius:10px; padding:9px 10px; font-weight:600;
      color:#051016; background:var(--accent); cursor:pointer;
    }
    button.secondary { background:#2a3542; color:#e8eef5; }
    .status { margin-top:10px; background:#0f1722; border:1px solid #213140; border-radius:10px; padding:8px; font-size:12px; color:var(--muted); }
    canvas { display:block; }
  </style>
</head>
<body>
  <div id="ui">
    <div style="font-weight:700; margin-bottom:4px;">Atractor Aizawa + SVG</div>
    <div class="sub">Carga un SVG y controla cómo el trazo es atraído o repelido por su forma.</div>

    <div class="row">
      <label><span>Frecuencia (d)</span><span id="freqVal">3.50</span></label>
      <input id="freq" type="range" min="1" max="7" step="0.01" value="3.5" />
    </div>

    <div class="row">
      <label><span>Atracción SVG</span><span id="attVal">0.00</span></label>
      <input id="attraction" type="range" min="0" max="2" step="0.01" value="0" />
    </div>

    <div class="row">
      <label><span>Repulsión SVG</span><span id="repVal">0.00</span></label>
      <input id="repulsion" type="range" min="0" max="2" step="0.01" value="0" />
    </div>

    <div class="row">
      <label><span>Radio de influencia</span><span id="radVal">18.0</span></label>
      <input id="influenceRadius" type="range" min="5" max="40" step="0.5" value="18" />
    </div>

    <div class="row">
      <label><span>Muestreo de puntos SVG</span><span id="samVal">400</span></label>
      <input id="samples" type="range" min="80" max="1200" step="20" value="400" />
    </div>

    <div class="row">
      <label><span>Subir SVG</span></label>
      <input id="svgInput" type="file" accept=".svg,image/svg+xml" />
    </div>

    <div class="btns">
      <button id="resetBtn" class="secondary">Reset trayectoria</button>
      <button id="toggleRot">Pausar giro</button>
    </div>

    <div class="status" id="status">Sin SVG cargado. El sistema usa solo el modelo Aizawa.</div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    let scene, camera, renderer, line, geometry, material;
    let x = 0.1, y = 0, z = 0;
    let points = [];
    const dt = 0.01;
    const maxPoints = 7000;
    let rotateOn = true;

    const params = {
      a: 0.95,
      b: 0.7,
      c: 0.6,
      d: 3.5,
      e: 0.25,
      f: 0.1,
      attraction: 0,
      repulsion: 0,
      influenceRadius: 18,
      samples: 400
    };

    // Puntos del SVG convertidos a espacio del atractor.
    let svgTargets = [];

    function resetTrail() {
      points = [];
      x = 0.1;
      y = 0;
      z = 0;
      geometry.setFromPoints(points);
    }

    function updateLabels() {
      $("freqVal").textContent = params.d.toFixed(2);
      $("attVal").textContent = params.attraction.toFixed(2);
      $("repVal").textContent = params.repulsion.toFixed(2);
      $("radVal").textContent = params.influenceRadius.toFixed(1);
      $("samVal").textContent = String(params.samples);
    }

    function nearestForce(px, py, pz) {
      if (!svgTargets.length) return { fx: 0, fy: 0, fz: 0 };

      let nearest = null;
      let bestD2 = Infinity;

      for (const t of svgTargets) {
        const dx = t.x - px;
        const dy = t.y - py;
        const dz = t.z - pz;
        const d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < bestD2) {
          bestD2 = d2;
          nearest = { dx, dy, dz };
        }
      }

      if (!nearest) return { fx: 0, fy: 0, fz: 0 };

      const r = Math.max(0.0001, Math.sqrt(bestD2));
      const influence = Math.exp(-(bestD2) / (2 * params.influenceRadius * params.influenceRadius));
      const signedStrength = (params.attraction - params.repulsion) * influence;

      return {
        fx: (nearest.dx / r) * signedStrength,
        fy: (nearest.dy / r) * signedStrength,
        fz: (nearest.dz / r) * signedStrength
      };
    }

    function parseSvgToTargets(svgText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(svgText, "image/svg+xml");

      if (doc.querySelector("parsererror")) {
        throw new Error("SVG inválido");
      }

      const paths = Array.from(doc.querySelectorAll("path"));
      if (!paths.length) {
        return [];
      }

      const host = document.createElement("div");
      host.style.position = "fixed";
      host.style.left = "-99999px";
      host.style.top = "-99999px";
      host.style.width = "1px";
      host.style.height = "1px";
      host.style.opacity = "0";
      host.innerHTML = svgText;
      document.body.appendChild(host);

      const mountedSvg = host.querySelector("svg");
      const mountedPaths = mountedSvg ? Array.from(mountedSvg.querySelectorAll("path")) : [];
      if (!mountedSvg || !mountedPaths.length) {
        host.remove();
        return [];
      }

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of mountedPaths) {
        const len = p.getTotalLength();
        const localSamples = Math.max(20, Math.floor(params.samples / mountedPaths.length));
        for (let i = 0; i <= localSamples; i++) {
          const pt = p.getPointAtLength((i / localSamples) * len);
          minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
          minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y);
        }
      }

      const w = Math.max(1e-6, maxX - minX);
      const h = Math.max(1e-6, maxY - minY);
      const s = 28 / Math.max(w, h);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;

      const targets = [];
      for (const p of mountedPaths) {
        const len = p.getTotalLength();
        const localSamples = Math.max(20, Math.floor(params.samples / mountedPaths.length));
        for (let i = 0; i <= localSamples; i++) {
          const pt = p.getPointAtLength((i / localSamples) * len);
          const nx = (pt.x - cx) * s;
          const ny = -(pt.y - cy) * s;
          // Empotrado sobre el plano z=0 para usar atracción/repulsión 3D.
          targets.push({ x: nx, y: ny, z: 0 });
        }
      }

      host.remove();
      return targets;
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.z = 75;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      geometry = new THREE.BufferGeometry();
      material = new THREE.LineBasicMaterial({ color: 0x66e3ff });
      line = new THREE.Line(geometry, material);
      scene.add(line);

      const axis = new THREE.AxesHelper(18);
      axis.material.transparent = true;
      axis.material.opacity = 0.3;
      scene.add(axis);

      $("freq").addEventListener("input", (e) => {
        params.d = parseFloat(e.target.value);
        updateLabels();
      });

      $("attraction").addEventListener("input", (e) => {
        params.attraction = parseFloat(e.target.value);
        updateLabels();
      });

      $("repulsion").addEventListener("input", (e) => {
        params.repulsion = parseFloat(e.target.value);
        updateLabels();
      });

      $("influenceRadius").addEventListener("input", (e) => {
        params.influenceRadius = parseFloat(e.target.value);
        updateLabels();
      });

      $("samples").addEventListener("input", (e) => {
        params.samples = parseInt(e.target.value, 10);
        updateLabels();
      });

      $("svgInput").addEventListener("change", async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          svgTargets = parseSvgToTargets(text);
          $("status").textContent = svgTargets.length
            ? `SVG cargado: ${svgTargets.length} puntos de guía activos.`
            : "El SVG no tiene rutas <path> utilizables.";
          resetTrail();
        } catch (err) {
          svgTargets = [];
          $("status").textContent = `Error al leer SVG: ${err.message}`;
        }
      });

      $("resetBtn").addEventListener("click", () => {
        resetTrail();
      });

      $("toggleRot").addEventListener("click", () => {
        rotateOn = !rotateOn;
        $("toggleRot").textContent = rotateOn ? "Pausar giro" : "Reanudar giro";
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      updateLabels();
    }

    function animate() {
      requestAnimationFrame(animate);

      // Ecuaciones base Aizawa.
      const dxA = (z - params.b) * x - params.d * y;
      const dyA = params.d * x + (z - params.b) * y;
      const dzA = params.c + params.a * z - Math.pow(z, 3) / 3 - (x * x + y * y) * (1 + params.e * z) + params.f * z * Math.pow(x, 3);

      // Fuerza de atracción/repulsión hacia puntos muestreados del SVG.
      const pull = nearestForce(x * 10, y * 10, z * 10);

      // Escala de acoplamiento para que la fuerza no destruya la dinámica base.
      const coupling = 0.22;
      const dx = (dxA + coupling * pull.fx) * dt;
      const dy = (dyA + coupling * pull.fy) * dt;
      const dz = (dzA + coupling * pull.fz) * dt;

      x += dx;
      y += dy;
      z += dz;

      points.push(new THREE.Vector3(x * 10, y * 10, z * 10));
      if (points.length > maxPoints) points.shift();

      geometry.setFromPoints(points);
      if (rotateOn) line.rotation.y += 0.004;
      renderer.render(scene, camera);

      $("status").textContent = svgTargets.length
        ? `SVG activo · puntos: ${svgTargets.length} · atracción=${params.attraction.toFixed(2)} · repulsión=${params.repulsion.toFixed(2)}`
        : "Sin SVG cargado. El sistema usa solo el modelo Aizawa.";
    }

    init();
    animate();
  </script>
</body>
</html>
